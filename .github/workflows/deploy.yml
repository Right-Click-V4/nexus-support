name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Restore + patch portal
        timeout-minutes: 5
        run: |
          set -e
          run_py() { if [ -f "$1" ]; then timeout 45 python3 "$1" || echo "WARN: $1 exited/timeout"; fi; }

          CP_SZ=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
          echo "CustomerPortal bytes=$CP_SZ"
          if [ "$CP_SZ" -lt 50000 ] || grep -q "Loading portal update" src/components/CustomerPortal.tsx 2>/dev/null || ! grep -q "PortalLiveChat\|Live Chat\|My tickets\|export default function CustomerPortal" src/components/CustomerPortal.tsx 2>/dev/null; then
            GOOD=c3edde907e5e5be48439b7fea0df6dbe3dca6611
            echo "Restoring CustomerPortal from $GOOD"
            git show "$GOOD:src/components/CustomerPortal.tsx" > src/components/CustomerPortal.tsx 2>/dev/null || true
            CP_SZ2=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
            if [ "$CP_SZ2" -lt 50000 ]; then
              curl -fsSL --max-time 30 "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/$GOOD/src/components/CustomerPortal.tsx" -o src/components/CustomerPortal.tsx || true
            fi
            echo "CustomerPortal after restore=$(wc -c < src/components/CustomerPortal.tsx)"
          fi

          AN_SZ=$(wc -c < src/components/AnnouncementsPage.tsx 2>/dev/null || echo 0)
          if [ "$AN_SZ" -lt 5000 ]; then
            GOOD_AN=6a15e5bbd61dead1452de6571ce7eda6292323aa
            git show "$GOOD_AN:src/components/AnnouncementsPage.tsx" > src/components/AnnouncementsPage.tsx 2>/dev/null || \
              curl -fsSL --max-time 30 "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/$GOOD_AN/src/components/AnnouncementsPage.tsx" -o src/components/AnnouncementsPage.tsx || true
            run_py scripts/patch_announcements_replace_publish.py
          fi

          run_py scripts/patch_release_notes_persist.py

          PC_SZ=$(wc -c < src/context/PlatformContext.tsx 2>/dev/null || echo 0)
          echo "PlatformContext bytes=$PC_SZ"
          if [ "$PC_SZ" -lt 5000 ]; then
            GOOD_PC=9da2fccde137836cea2c0651da8f808d1051f67e
            echo "Restoring PlatformContext from blob or $GOOD_PC"
            run_py scripts/restore_platform_blob.py
            PC_SZ2=$(wc -c < src/context/PlatformContext.tsx 2>/dev/null || echo 0)
            if [ "$PC_SZ2" -lt 5000 ]; then
              git show "$GOOD_PC:src/context/PlatformContext.tsx" > src/context/PlatformContext.tsx 2>/dev/null || true
              curl -fsSL --max-time 30 "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/$GOOD_PC/src/context/PlatformContext.tsx" -o src/context/PlatformContext.tsx || true
            fi
            echo "PlatformContext after restore=$(wc -c < src/context/PlatformContext.tsx)"
          fi

          TC_SZ=$(wc -c < src/context/TicketContext.tsx 2>/dev/null || echo 0)
          if [ "$TC_SZ" -lt 8000 ]; then
            run_py scripts/restore_ticket_blob.py
            curl -fsSL --max-time 30 "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/c3edde907e5e5be48439b7fea0df6dbe3dca6611/src/context/TicketContext.tsx" -o src/context/TicketContext.tsx || true
          fi

          run_py scripts/restore_livechat_blob.py

          for s in slow_polls patch_claim_chat patch_customer_route patch_portal_sidebar_agent_style wire_account_panel patch_assist_chat patch_assist_dedupe ensure_react_hooks densify_stars patch_portal_chat_ui patch_forgot_password ensure_resolve_chat fix_send_chat_message fix_claim_and_send patch_chat_realtime patch_chat_order_ui patch_hold_nuclear patch_portal_signout_dialog patch_login_star_motion patch_portal_logo; do
            run_py "scripts/${s}.py"
          done

          # Final critical repairs
          run_py scripts/patch_chat_realtime.py
          run_py scripts/patch_chat_order_ui.py
          run_py scripts/patch_livechat_claim_ui_v2.py
          run_py scripts/patch_claim_owner_controls.py
          run_py scripts/patch_assist_modal_v3.py
          run_py scripts/patch_livechat_nonowner_lock.py
          run_py scripts/patch_assist_broadcast_v4.py
          run_py scripts/patch_msg_agent_id.py
          run_py scripts/patch_avatar_cross_browser.py
          run_py scripts/patch_fix_auto_assignee.py
          run_py scripts/patch_assert_approved_v2.py
          run_py scripts/patch_approve_sync_profiles.py

          test $(wc -c < src/components/CustomerPortal.tsx) -gt 50000 && echo OK_PORTAL || { echo FAIL_PORTAL; exit 1; }
          test $(wc -c < src/context/PlatformContext.tsx) -gt 5000 && echo OK_PLATFORM || { echo FAIL_PLATFORM; exit 1; }
          test $(wc -c < src/components/LiveChatPage.tsx) -gt 5000 && echo OK_LIVECHAT || { echo FAIL_LIVECHAT; exit 1; }
          test $(wc -c < src/components/PortalLiveChatView.tsx) -gt 5000 && echo OK_PORTAL_LC || { echo FAIL_PORTAL_LC; exit 1; }
          grep -q "CHAT_REALTIME_V1\|Messenger-style" src/context/PlatformContext.tsx && echo OK_CHAT_RT || { echo FAIL_CHAT_RT; exit 1; }
          grep -q "AUTO_ASSIGNEE_FIX_V1\|ticket.assignee_id ?" src/context/TicketContext.tsx && echo OK_ASSIGNEE || echo WARN_ASSIGNEE

      - name: Generate git changelog draft
        run: |
          timeout 30 python3 scripts/generate_git_changelog.py || true
          ls -la public/git-changelog-draft.json || echo WARN_CHANGELOG

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
