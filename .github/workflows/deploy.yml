name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Restore + patch portal
        timeout-minutes: 8
        run: |
          set -e
          run_py() {
            local f="$1"
            if [ -f "$f" ]; then
              echo ">> $f"
              timeout 45s python3 "$f" || echo "WARN timeout/fail $f"
            fi
          }

          python3 scripts/restore_core_blobs.py

          restore_if_stub() {
            local path="$1" min="$2" needle="$3" sha="$4"
            local sz
            sz=$(wc -c < "$path" 2>/dev/null || echo 0)
            if [ "$sz" -lt "$min" ] || grep -qE "SEE_LOCAL_FILE|PLACEHOLDER" "$path" 2>/dev/null || ! grep -q "$needle" "$path" 2>/dev/null; then
              echo "Restoring $path from $sha (was $sz)"
              git show "$sha:$path" > "$path" 2>/dev/null || true
              sz2=$(wc -c < "$path" 2>/dev/null || echo 0)
              if [ "$sz2" -lt "$min" ]; then
                curl -fsSL --max-time 30 "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/$sha/$path" -o "$path"
              fi
              echo "  after=$(wc -c < "$path" 2>/dev/null || echo 0)"
            fi
          }
          restore_if_stub src/context/PlatformContext.tsx 10000 "export function usePlatform" e3a5fd3
          restore_if_stub src/context/TicketContext.tsx 15000 "export function useTickets" c3b543f
          restore_if_stub src/components/PortalLiveChatView.tsx 5000 "export default" 24910bd
          restore_if_stub src/components/LiveChatPage.tsx 5000 "export default" 24910bd

          CP_SZ=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
          echo "CustomerPortal bytes=$CP_SZ"
          if [ "$CP_SZ" -lt 50000 ] || grep -q "Loading portal update" src/components/CustomerPortal.tsx 2>/dev/null || ! grep -qE "PortalLiveChat|Live Chat|My tickets|export default function CustomerPortal" src/components/CustomerPortal.tsx 2>/dev/null; then
            GOOD=c3edde907e5e5be48439b7fea0df6dbe3dca6611
            echo "Restoring CustomerPortal from $GOOD"
            git show "$GOOD:src/components/CustomerPortal.tsx" > src/components/CustomerPortal.tsx 2>/dev/null || true
            CP_SZ2=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
            if [ "$CP_SZ2" -lt 50000 ]; then
              curl -fsSL --max-time 30 "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/$GOOD/src/components/CustomerPortal.tsx" -o src/components/CustomerPortal.tsx
            fi
            echo "CustomerPortal after restore=$(wc -c < src/components/CustomerPortal.tsx)"
          fi

          run_py scripts/patch_release_notes_persist.py

          for s in slow_polls patch_login_ui_v1 patch_login_stars_trail_v2 patch_login_trail_v3 patch_login_trail_v4 patch_login_stars_v5 patch_claim_chat patch_customer_route patch_portal_sidebar_agent_style wire_account_panel patch_assist_chat patch_assist_dedupe ensure_react_hooks densify_stars patch_portal_chat_ui patch_forgot_password ensure_resolve_chat fix_send_chat_message fix_claim_and_send patch_chat_realtime patch_chat_order_ui patch_hold_nuclear patch_portal_signout_dialog patch_login_star_motion patch_portal_logo; do
            run_py "scripts/${s}.py"
          done

          run_py scripts/patch_chat_realtime.py
          run_py scripts/patch_chat_order_ui.py
          run_py scripts/patch_livechat_claim_ui_v2.py
          run_py scripts/patch_claim_owner_controls.py
          run_py scripts/patch_assist_modal_v3.py
          run_py scripts/patch_livechat_nonowner_lock.py
          run_py scripts/patch_assist_broadcast_v4.py
          run_py scripts/patch_assist_accept_sync_v5.py
          run_py scripts/patch_assist_approve_unlock_v6.py
          run_py scripts/patch_assist_via_messages_v7.py
          run_py scripts/patch_msg_agent_id.py
          run_py scripts/patch_avatar_cross_browser.py
          run_py scripts/patch_fix_auto_assignee.py
          run_py scripts/patch_assert_approved_v2.py
          run_py scripts/patch_approve_sync_profiles.py
          run_py scripts/patch_hotfix_v2.py

          run_py scripts/schema_safe_customers.py

          test $(wc -c < src/components/CustomerPortal.tsx) -gt 50000 && echo OK_PORTAL
          test $(wc -c < src/context/PlatformContext.tsx) -gt 5000 && echo OK_PLATFORM
          test $(wc -c < src/components/LiveChatPage.tsx) -gt 5000 && echo OK_LIVECHAT
          test $(wc -c < src/components/PortalLiveChatView.tsx) -gt 5000 && echo OK_PORTAL_LC
          grep -q "export function useTickets" src/context/TicketContext.tsx && echo OK_TICKETS
          grep -q "export function usePlatform" src/context/PlatformContext.tsx && echo OK_USE_PLATFORM

      - name: Generate git changelog draft
        run: |
          timeout 30 python3 scripts/generate_git_changelog.py || true
          ls -la public/git-changelog-draft.json || echo WARN_CHANGELOG

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
