name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Boot UI (loader + post-login ceremony)
        run: |
          set -e
          if ! grep -q notifRef src/SystemApp.tsx 2>/dev/null; then
            echo "Restoring full SystemApp..."
            curl -fsSL "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/1b72983c13f2e5104682cc41c7fca903a53c452d/src/SystemApp.tsx" -o src/SystemApp.tsx
          fi
          python3 scripts/patch_postlogin_boot.py || true
          python3 scripts/patch_boot_ui.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PostLoginLoader.tsx src/SystemApp.tsx src/components/PortalAuthGate.tsx || true
          git commit -m "feat(ui): enhanced loader; ceremony-only after login" || true
          git push || true

      - name: Restore full CustomerPortal if needed
        run: |
          set -e
          if ! grep -q PortalLiveChat src/components/CustomerPortal.tsx 2>/dev/null; then
            echo "Restoring full CustomerPortal..."
            curl -fsSL "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/e973f0632f202e8dc0dabbbc65a8be25600c23f9/src/components/CustomerPortal.tsx" -o src/components/CustomerPortal.tsx
            sed -i 's/bg-zinc-950 text-zinc-100 flex-col border-r border-zinc-800 relative z-30/portal-sidebar flex-col relative z-30/' src/components/CustomerPortal.tsx
            python3 scripts/patch_cp.py || true
            grep -q PortalLiveChat src/components/CustomerPortal.tsx
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/CustomerPortal.tsx
            git commit -m "fix: restore full CustomerPortal features" || true
            git push || true
          fi

      - name: Patch topbar (icons + descriptions)
        run: |
          set -e
          python3 scripts/patch_topbar.py || true
          if grep -q VIEW_META src/components/CustomerPortal.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/CustomerPortal.tsx
            git commit -m "feat(portal): topbar icons, larger titles, descriptions" || true
            git push || true
          fi

      - name: Remove Back links from portal tabs
        run: |
          set -e
          python3 scripts/patch_remove_back.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CustomerPortal.tsx src/components/PortalLiveChat.tsx
          git commit -m "fix(portal): remove Back links from tabs" || true
          git push || true

      - name: Add portal footer
        run: |
          set -e
          python3 scripts/patch_footer.py || true
          python3 scripts/patch_footer_center.py || true
          python3 scripts/patch_footer_in_main.py || true
          if grep -q portal-footer src/components/CustomerPortal.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/CustomerPortal.tsx
            git commit -m "feat(portal): footer inside scrollable main content" || true
            git push || true
          fi

      - name: Lock scroll to main content only
        run: |
          set -e
          python3 scripts/patch_scroll_lock.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CustomerPortal.tsx
          git commit -m "feat(portal): freeze sidebar and topbar; main scrolls only" || true
          git push || true

      - name: Rename Home to Overview
        run: |
          set -e
          python3 scripts/patch_overview_rename.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CustomerPortal.tsx
          git commit -m "feat(portal): rename Home tab to Overview" || true
          git push || true

      - name: Fix light-mode sidebar (purple glass)
        run: |
          set -e
          python3 scripts/fix_sidebar_light.py || true
          python3 scripts/patch_chrome_darker.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/portal-lounge.css || true
          git commit -m "style: slightly darker topbar and sidebar" || true
          git push || true

      - name: Wire announcement marquee
        run: |
          set -e
          python3 scripts/patch_marquee.py || true
          python3 scripts/patch_marquee_css.py || true
          python3 scripts/patch_marquee_sep_css.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CustomerPortal.tsx src/components/PortalAnnouncementMarquee.tsx src/portal-lounge.css || true
          git commit -m "feat(portal): seamless full-width marquee with gaps" || true
          git push || true

      - name: Wire announcement channel filters
        run: |
          set -e
          python3 scripts/patch_channel.py || true
          python3 scripts/patch_channel_title.py || true
          python3 scripts/patch_announce_live_full.py || true
          python3 scripts/patch_announce_v3.py || true
          python3 scripts/patch_announce_rt.py || true
          python3 scripts/patch_portal_reload.py || true
          python3 scripts/patch_strip_display.py || true
          python3 scripts/patch_overview_channel.py || true
          python3 scripts/patch_announce_color_sync.py || true
          python3 scripts/patch_pc_cleanup.py || true
          python3 scripts/patch_dbtitle_color.py || true
          python3 scripts/patch_portal_hard_reload.py || true
          python3 scripts/patch_display_strip_v2.py || true
          python3 scripts/patch_announce_realtime.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/PlatformContext.tsx src/components/PortalHome.tsx src/components/AnnouncementsPage.tsx src/components/CustomerPortal.tsx || true
          git commit -m "feat: Supabase realtime + poll for announcements across browsers" || true
          git push || true

      - name: Fix portal layout (community + footer)
        run: |
          set -e
          if ! grep -q "DEFAULT_GROUP_ID" src/components/PortalCommunityChat.tsx 2>/dev/null; then
            echo "Restoring PortalCommunityChat..."
            curl -fsSL "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/a3f7b260cd8c6e3200bbe03b10c1524df894badc/src/components/PortalCommunityChat.tsx" -o src/components/PortalCommunityChat.tsx
          fi
          python3 scripts/patch_community_ux.py || true
          python3 scripts/patch_community_panel.py || true
          python3 scripts/patch_community_cloud_min.py || true
          python3 scripts/patch_community_media.py || true
          python3 scripts/patch_community_footer_space.py || true
          python3 scripts/patch_footer_flow.py || true
          python3 scripts/patch_community_glass_marquee.py || true
          python3 scripts/patch_community_contrast.py || true
          python3 scripts/patch_chrome_darker.py || true
          python3 scripts/patch_chrome_footer_v2.py || true
          python3 scripts/patch_nav_signout.py || true
          python3 scripts/patch_swap_signout.py || true
          python3 scripts/patch_labels_titlecase.py || true
          python3 scripts/patch_submit_form.py || true
          python3 scripts/patch_submit_layout.py || true
          python3 scripts/patch_branch_list.py || true
          python3 scripts/patch_submit_left_subject.py || true
          python3 scripts/patch_submit_guide.py || true
          python3 scripts/patch_submit_overview_layout.py || true
          python3 scripts/patch_submit_fill.py || true
          python3 scripts/patch_submit_glow.py || true
          python3 scripts/patch_priority_glow.py || true
          python3 scripts/patch_submit_modal.py || true
          python3 scripts/patch_tickets_sync.py || true
          python3 scripts/patch_tickets_noflicker.py || true
          python3 scripts/patch_portal_layout.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PortalCommunityChat.tsx src/components/CustomerPortal.tsx src/components/Sidebar.tsx src/components/PortalHome.tsx src/components/TicketsPage.tsx src/context/TicketContext.tsx src/portal-lounge.css src/index.css src/lib/communityApi.ts || true
          git commit -m "feat: ticket received modal popup on submit" || true
          git push || true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Deploy dist to gh-pages (keep existing preview/)
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf work-gh-pages
          mkdir work-gh-pages
          cd work-gh-pages
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch origin gh-pages --depth=1 && git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout -f origin/gh-pages
            git checkout -B gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name preview ! -name '.git' -exec rm -rf {} +
          else
            git checkout --orphan gh-pages
          fi
          cp -a ../dist/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy ${GITHUB_SHA}" || echo "No changes"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
