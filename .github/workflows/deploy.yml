name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Restore + critical patches
        run: |
          set -e
          python3 scripts/patch_fix_profile_escape.py || true
          python3 scripts/patch_restore_customer_portal.py
          python3 scripts/join_cpacc.py || true
          python3 scripts/patch_restore_platform_ctx.py
          python3 scripts/patch_fix_cp_jsx_topbar.py || true
          python3 scripts/patch_ticket_ops_timeout.py || true
          python3 scripts/patch_postlogin_force_exit.py || true
          python3 scripts/patch_profile_rework.py || true
          python3 scripts/patch_profile_fetch_resilient.py || true
          python3 scripts/patch_status_fab.py || true
          python3 scripts/patch_livechat_fix_v2.py || true
          python3 scripts/patch_livechat_ui_404.py || true
          python3 scripts/patch_livechat_dark_presence.py || true
          python3 scripts/patch_livechat_lcp_dedupe.py || true
          python3 scripts/patch_dark_class_theme.py || true
          python3 scripts/patch_no_demo_agents.py || true
          python3 scripts/patch_desk_presence.py || true
          python3 scripts/patch_desk_404.py || true
          python3 scripts/patch_error_404_flow.py || true
          python3 scripts/patch_login_speed.py || true
          python3 scripts/patch_status_chat_sync.py || true
          python3 scripts/patch_restore_admin_features.py || true
          python3 scripts/patch_livechat_archive_delete.py || true
          python3 scripts/patch_livechat_delete_hold.py || true
          python3 scripts/patch_chat_persist.py || true
          python3 scripts/patch_livechat_emoji_full.py || true
          python3 scripts/patch_portal_disabled.py || true
          python3 scripts/join_hc.py || true
          python3 scripts/run_scroll_top.py || true
          python3 scripts/run_auth_profile.py || true
          python3 scripts/join_acc.py || true
          python3 scripts/run_plc_nick.py || true
          if [ ! -s src/components/LiveChatPage.tsx ] || ! grep -q 'export default' src/components/LiveChatPage.tsx; then
            echo "ERROR: LiveChatPage.tsx is empty or missing export" >&2
            exit 1
          fi
          wc -c src/components/LiveChatPage.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || true
          git commit -m "ci: post-patch snapshot" || true
          git push || true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
