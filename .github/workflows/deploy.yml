name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Restore + patch portal
        run: |
          set -e
          GOOD_CP=c3edde907e5e5be48439b7fea0df6dbe3dca6611
          GOOD_PLV=4ef62119
          CP_SZ=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
          PLV_SZ=$(wc -c < src/components/PortalLiveChatView.tsx 2>/dev/null || echo 0)
          if [ "$CP_SZ" -lt 50000 ] || ! grep -q "PortalLiveChat\|CustomerPortal" src/components/CustomerPortal.tsx 2>/dev/null; then
            echo "Restoring CustomerPortal from $GOOD_CP"
            git show "$GOOD_CP:src/components/CustomerPortal.tsx" > src/components/CustomerPortal.tsx
          fi
          if [ "$PLV_SZ" -lt 5000 ] || grep -q "PLACEHOLDER" src/components/PortalLiveChatView.tsx 2>/dev/null; then
            echo "Restoring PortalLiveChatView from $GOOD_PLV"
            git show "$GOOD_PLV:src/components/PortalLiveChatView.tsx" > src/components/PortalLiveChatView.tsx
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/PortalLiveChatView.tsx')
          s = p.read_text()
          old = "const att = parseChatAttachment(m.text || m.body || '');"
          if old in s and "const parsed = parseChatAttachment" not in s:
            s = s.replace(
              old,
              "const parsed = parseChatAttachment(m.text || m.body || '');\n            const att = parsed.att;\n            const displayText = (parsed.text || m.text || m.body || '').trim();",
              1,
            )
            s = s.replace(
              "{att ? (\n                    isImageMime(att.mime) ? (\n                      <img src={att.url} alt={att.name} className=\"max-w-full rounded-lg\" />\n                    ) : (\n                      <a href={att.url} download={att.name} className=\"underline\">{att.name}</a>\n                    )\n                  ) : (\n                    <div className=\"whitespace-pre-wrap break-words\">{m.text || m.body || ''}</div>\n                  )}",
              "{att ? (\n                    <div className=\"space-y-1\">\n                      {isImageMime(att.mime) ? (\n                        <img src={att.url} alt={att.name || 'attachment'} className=\"max-w-full rounded-lg\" />\n                      ) : (\n                        <a href={att.url} download={att.name} className=\"underline break-all\">{att.name || 'Download file'}</a>\n                      )}\n                      {displayText ? <div className=\"whitespace-pre-wrap break-words\">{displayText}</div> : null}\n                    </div>\n                  ) : (\n                    <div className=\"whitespace-pre-wrap break-words\">{displayText || m.text || m.body || ''}</div>\n                  )}",
              1,
            )
            p.write_text(s)
            print('Applied parseChatAttachment fix')
          else:
            print('parseChatAttachment already fixed or pattern missing')
          PY
          echo "export { default } from './PortalLiveChatView';" > src/components/PortalLiveChat.tsx
          if [ -f scripts/patch_livechat_order.py ]; then python3 scripts/patch_livechat_order.py || true; fi
          if [ -f scripts/patch_chat_realtime_sync.py ]; then python3 scripts/patch_chat_realtime_sync.py || true; fi
          if [ -f scripts/patch_sidebar_and_light.py ]; then python3 scripts/patch_sidebar_and_light.py || true; fi
          if [ -f scripts/patch_help_chat_light.py ]; then python3 scripts/patch_help_chat_light.py || true; fi
          if [ -f scripts/patch_dark_contrast.py ]; then python3 scripts/patch_dark_contrast.py || true; fi
          if [ -f scripts/patch_chat_exclusive.py ]; then python3 scripts/patch_chat_exclusive.py || true; fi
          if [ -f scripts/patch_send_optimistic.py ]; then python3 scripts/patch_send_optimistic.py || true; fi
          python3 scripts/patch_portal_logo.py || true
          grep -q "PortalLiveChat\|parseChatAttachment\|createChat" src/components/CustomerPortal.tsx || grep -q "export default" src/components/CustomerPortal.tsx
          test -f src/SystemApp.tsx
          test $(wc -c < src/components/PortalLiveChatView.tsx) -gt 5000
          echo "Portal files ready"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
