name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Restore + patch portal
        run: |
          set +e
          CP_SZ=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
          echo "CustomerPortal bytes=$CP_SZ"
          if [ "$CP_SZ" -lt 50000 ] || ! grep -q "PortalLiveChat\|Live Chat\|export default function CustomerPortal" src/components/CustomerPortal.tsx 2>/dev/null; then
            GOOD=c3edde907e5e5be48439b7fea0df6dbe3dca6611
            echo "Restoring CustomerPortal from $GOOD (was $CP_SZ bytes)"
            git show "$GOOD:src/components/CustomerPortal.tsx" > src/components/CustomerPortal.tsx 2>/dev/null || true
          fi
          UA_SZ=$(wc -c < src/components/UsersAdminPage.tsx 2>/dev/null || echo 0)
          echo "UsersAdminPage bytes=$UA_SZ"
          if [ "$UA_SZ" -lt 5000 ]; then
            echo "Restoring UsersAdminPage (was $UA_SZ)"
            git show c3edde907e5e5be48439b7fea0df6dbe3dca6611:src/components/UsersAdminPage.tsx > src/components/UsersAdminPage.tsx 2>/dev/null || true
          fi
          APP_SZ=$(wc -c < src/components/AccountProfilePanel.tsx 2>/dev/null || echo 0)
          echo "AccountProfilePanel bytes=$APP_SZ"
          if [ "$APP_SZ" -lt 5000 ] || ! grep -q "saveProfile\|updateProfile" src/components/AccountProfilePanel.tsx 2>/dev/null; then
            APP_GOOD=5c66d77e570a692458f687b232763a609ae2e435
            echo "Restoring AccountProfilePanel from $APP_GOOD (was $APP_SZ bytes)"
            git show "$APP_GOOD:src/components/AccountProfilePanel.tsx" > src/components/AccountProfilePanel.tsx 2>/dev/null || true
          fi
          LS_SZ=$(wc -c < src/components/LoginScene.tsx 2>/dev/null || echo 0)
          echo "LoginScene bytes=$LS_SZ"
          if [ "$LS_SZ" -lt 18000 ] || ! grep -q "login-trail-spark\|LogoPilotStage" src/components/LoginScene.tsx 2>/dev/null; then
            SCENE_GOOD=3e5d6e35245ff6aef5e0f49e7c06ee7e24183f61
            echo "Restoring LoginScene from $SCENE_GOOD (was $LS_SZ bytes)"
            git show "$SCENE_GOOD:src/components/LoginScene.tsx" > src/components/LoginScene.tsx 2>/dev/null || true
          fi
          LF_SZ=$(wc -c < src/components/LoginFlybys.tsx 2>/dev/null || echo 0)
          if [ "$LF_SZ" -lt 5000 ] || ! grep -q "SpaceFlybys" src/components/LoginFlybys.tsx 2>/dev/null; then
            git show 3e5d6e35245ff6aef5e0f49e7c06ee7e24183f61:src/components/LoginFlybys.tsx > src/components/LoginFlybys.tsx 2>/dev/null || true
          fi
          AC_SZ=$(wc -c < src/context/AuthContext.tsx 2>/dev/null || echo 0)
          echo "AuthContext bytes=$AC_SZ"
          if [ "$AC_SZ" -lt 5000 ] || ! grep -q "updateProfile" src/context/AuthContext.tsx 2>/dev/null; then
            echo "Restoring AuthContext (was $AC_SZ)"
            git show 8d96841be7ce561fcd2ccf6604cf766ba59db8e0:src/context/AuthContext.tsx > src/context/AuthContext.tsx 2>/dev/null || true
          fi
          if [ -f scripts/patch_send_optimistic.py ]; then python3 scripts/patch_send_optimistic.py || true; fi
          if [ -f scripts/patch_dialogs_wire.py ]; then python3 scripts/patch_dialogs_wire.py || true; fi
          if [ -f scripts/patch_livechat_persist.py ]; then python3 scripts/patch_livechat_persist.py || true; fi
          if [ -f scripts/patch_chat_sync.py ]; then python3 scripts/patch_chat_sync.py || true; fi
          if [ -f scripts/ensure_react_hooks.py ]; then python3 scripts/ensure_react_hooks.py || true; fi
          if [ -f scripts/patch_portal_logo.py ]; then python3 scripts/patch_portal_logo.py || true; fi
          if [ -f scripts/wire_account_panel.py ]; then python3 scripts/wire_account_panel.py || true; fi
          if [ -f scripts/patch_portal_sidebar_agent_style.py ]; then python3 scripts/patch_portal_sidebar_agent_style.py || true; fi
          if [ -f scripts/patch_unlock_404.py ]; then python3 scripts/patch_unlock_404.py || true; fi
          if [ -f scripts/patch_signout_confirm.py ]; then python3 scripts/patch_signout_confirm.py || true; fi
          if [ -f scripts/patch_branch_metric_contrast.py ]; then python3 scripts/patch_branch_metric_contrast.py || true; fi
          if [ -f scripts/patch_chat_customer_rt.py ]; then python3 scripts/patch_chat_customer_rt.py || true; fi
          if [ -f scripts/patch_customer_chat_identity.py ]; then python3 scripts/patch_customer_chat_identity.py || true; fi
          if [ -f scripts/patch_customer_branch.py ]; then python3 scripts/patch_customer_branch.py || true; fi
          if [ -f scripts/patch_branch_sync_login_ux.py ]; then python3 scripts/patch_branch_sync_login_ux.py || true; fi
          if [ -f scripts/patch_hold_preserve.py ]; then python3 scripts/patch_hold_preserve.py || true; fi
          if [ -f scripts/patch_hold_nuclear.py ]; then python3 scripts/patch_hold_nuclear.py || true; fi
          if [ -f scripts/ensure_react_hooks.py ]; then python3 scripts/ensure_react_hooks.py || true; fi
          CP_FINAL=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
          LS_FINAL=$(wc -c < src/components/LoginScene.tsx 2>/dev/null || echo 0)
          APP_FINAL=$(wc -c < src/components/AccountProfilePanel.tsx 2>/dev/null || echo 0)
          AC_FINAL=$(wc -c < src/context/AuthContext.tsx 2>/dev/null || echo 0)
          UA_FINAL=$(wc -c < src/components/UsersAdminPage.tsx 2>/dev/null || echo 0)
          echo "CP=$CP_FINAL LS=$LS_FINAL APP=$APP_FINAL AC=$AC_FINAL UA=$UA_FINAL"
          grep -q "SYNC_CUSTOMER_BRANCH" src/context/AuthContext.tsx && echo "OK_BRANCH_SYNC" || echo "WARN_BRANCH_SYNC"
          grep -q "export default" src/components/UsersAdminPage.tsx && echo "OK_USERS" || echo "WARN_USERS"
          grep -q "_held" src/context/PlatformContext.tsx && echo "OK_HOLD_NUCLEAR" || echo "WARN_HOLD_NUCLEAR"
          set -e

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
