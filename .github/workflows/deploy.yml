name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Restore last working system (86280b5)
        run: |
          set -e
          GOOD=86280b5d5fac3906c1fd833966bb64194200a6ec
          restore_if_bad() {
            local path="$1"
            local min="$2"
            local sz
            sz=$(wc -c < "$path" 2>/dev/null || echo 0)
            if [ ! -f "$path" ] || [ "$sz" -lt "$min" ]; then
              echo "RESTORING $path (was $sz bytes, need >= $min)"
              git show "$GOOD:$path" > "$path"
              echo "  now $(wc -c < "$path") bytes"
            else
              echo "OK $path ($sz bytes)"
            fi
          }
          restore_if_bad src/SystemApp.tsx 20000
          restore_if_bad src/components/PortalLiveChat.tsx 15000
          restore_if_bad src/components/CustomerPortal.tsx 50000
          restore_if_bad src/context/TicketContext.tsx 15000
          restore_if_bad src/lib/deskPresence.ts 2000
          CP_SZ=$(wc -c < src/components/CustomerPortal.tsx || echo 0)
          if [ "$CP_SZ" -lt 50000 ] || ! grep -q "PortalLiveChat" src/components/CustomerPortal.tsx; then
            echo "Restoring CustomerPortal from c3edde90 then wire..."
            git show c3edde907e5e5be48439b7fea0df6dbe3dca6611:src/components/CustomerPortal.tsx > src/components/CustomerPortal.tsx
            if [ -f scripts/wire_account_panel.py ]; then
              python3 scripts/wire_account_panel.py
            fi
          elif ! grep -q "AccountProfilePanel" src/components/CustomerPortal.tsx; then
            if [ -f scripts/wire_account_panel.py ]; then
              python3 scripts/wire_account_panel.py
            fi
          fi
          grep -q "PortalLiveChat" src/components/CustomerPortal.tsx
          grep -q "view === 'help'" src/components/CustomerPortal.tsx
          grep -q "view === 'submit'" src/components/CustomerPortal.tsx
          test "$(wc -c < src/SystemApp.tsx)" -gt 20000
          test "$(wc -c < src/components/PortalLiveChat.tsx)" -gt 15000
          echo "--- restore summary ---"
          wc -c src/SystemApp.tsx src/components/PortalLiveChat.tsx src/components/CustomerPortal.tsx src/context/TicketContext.tsx

      - name: Slow presence and poll intervals
        run: |
          set -e
          if [ -f scripts/slow_polls.py ]; then
            python3 scripts/slow_polls.py
          fi
          if grep -n "setInterval(() => refreshPlatform(), 3000)" src/components/PortalLiveChat.tsx 2>/dev/null; then
            echo "WARN: aggressive 3s poll still present"
          else
            echo "OK: portal chat polls slowed"
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Deploy dist to gh-pages
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf work-gh-pages
          mkdir work-gh-pages
          cd work-gh-pages
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch origin gh-pages --depth=1 && git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout -f origin/gh-pages
            git checkout -B gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name preview ! -name '.git' -exec rm -rf {} +
          else
            git checkout --orphan gh-pages
          fi
          cp -a ../dist/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy ${GITHUB_SHA}" || echo "No changes"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
