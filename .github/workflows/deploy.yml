name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Restore last working system (86280b5)
        run: |
          set -e
          GOOD=86280b5d5fac3906c1fd833966bb64194200a6ec
          restore_if_bad() {
            local path="$1"
            local min="$2"
            local sz
            sz=$(wc -c < "$path" 2>/dev/null || echo 0)
            if [ ! -f "$path" ] || [ "$sz" -lt "$min" ]; then
              echo "RESTORING $path (was $sz bytes, need >= $min)"
              git show "$GOOD:$path" > "$path"
              echo "  now $(wc -c < "$path") bytes"
            else
              echo "OK $path ($sz bytes)"
            fi
          }
          # SystemApp is owned by main — do not restore old monolith over logout/auth fixes
          restore_if_bad src/components/PortalLiveChat.tsx 15000
          restore_if_bad src/components/CustomerPortal.tsx 50000
          restore_if_bad src/context/TicketContext.tsx 15000
          restore_if_bad src/lib/deskPresence.ts 2000
          CP_SZ=$(wc -c < src/components/CustomerPortal.tsx || echo 0)
          if [ "$CP_SZ" -lt 50000 ] || ! grep -q "PortalLiveChat" src/components/CustomerPortal.tsx; then
            echo "Restoring CustomerPortal from c3edde90 then wire..."
            git show c3edde907e5e5be48439b7fea0df6dbe3dca6611:src/components/CustomerPortal.tsx > src/components/CustomerPortal.tsx
            if [ -f scripts/wire_account_panel.py ]; then
              python3 scripts/wire_account_panel.py
            fi
            if [ -f scripts/wire_help_kb.py ]; then python3 scripts/wire_help_kb.py; fi
          elif ! grep -q "AccountProfilePanel" src/components/CustomerPortal.tsx; then
            if [ -f scripts/wire_account_panel.py ]; then
              python3 scripts/wire_account_panel.py
            fi
          fi
          grep -q "PortalLiveChat" src/components/CustomerPortal.tsx
          test -f src/SystemApp.tsx
          test "$(wc -c < src/components/PortalLiveChat.tsx)" -gt 15000

      - name: Apply portal + ticket patches
        run: |
          set -e
          if [ -f scripts/slow_polls.py ]; then python3 scripts/slow_polls.py; fi
          if [ -f scripts/portal_fixes.py ]; then python3 scripts/portal_fixes.py; fi
          if [ -f scripts/wire_help_kb.py ]; then python3 scripts/wire_help_kb.py; fi
          if [ -f scripts/fix_customer_tickets.py ]; then python3 scripts/fix_customer_tickets.py; fi
          if [ -f scripts/install_clean_create_ticket.py ]; then python3 scripts/install_clean_create_ticket.py; fi
          grep -q "await supabase.from('tickets').insert(row)" src/context/TicketContext.tsx && echo "OK clean createTicket" || echo "WARN createTicket"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
