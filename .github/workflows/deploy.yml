name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Restore + patch portal
        run: |
          set +e
          run_py() { echo "RUN $1"; timeout 45s python3 "$1" || echo "WARN $1 exit $?"; }

          CP_SZ=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
          echo "CustomerPortal bytes=$CP_SZ"
          if [ "$CP_SZ" -lt 50000 ] || grep -q "Loading portal update\|PLACEHOLDER" src/components/CustomerPortal.tsx 2>/dev/null || ! grep -q "PortalLiveChat\|Live Chat\|export default function CustomerPortal" src/components/CustomerPortal.tsx 2>/dev/null; then
            GOOD=c3edde907e5e5be48439b7fea0df6dbe3dca6611
            echo "Restoring CustomerPortal from $GOOD"
            git show "$GOOD:src/components/CustomerPortal.tsx" > src/components/CustomerPortal.tsx 2>/dev/null || true
            if [ "$(wc -c < src/components/CustomerPortal.tsx)" -lt 50000 ]; then
              curl -fsSL --max-time 20 "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/$GOOD/src/components/CustomerPortal.tsx" -o src/components/CustomerPortal.tsx || true
            fi
          fi

          PC_SZ=$(wc -c < src/context/PlatformContext.tsx 2>/dev/null || echo 0)
          echo "PlatformContext bytes=$PC_SZ"
          if [ "$PC_SZ" -lt 5000 ] || grep -q "PLACEHOLDER" src/context/PlatformContext.tsx 2>/dev/null || ! grep -q "export function usePlatform" src/context/PlatformContext.tsx 2>/dev/null; then
            GOOD=e3a5fd3
            echo "Restoring PlatformContext from $GOOD"
            git show "$GOOD:src/context/PlatformContext.tsx" > src/context/PlatformContext.tsx 2>/dev/null || true
            if [ "$(wc -c < src/context/PlatformContext.tsx)" -lt 5000 ]; then
              curl -fsSL --max-time 20 "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/$GOOD/src/context/PlatformContext.tsx" -o src/context/PlatformContext.tsx || true
            fi
          fi

          run_py scripts/restore_platform_blob.py
          run_py scripts/restore_cp_blob.py
          run_py scripts/restore_ticket_blob.py
          run_py scripts/restore_livechat_blob.py

          for s in slow_polls patch_claim_chat patch_customer_route patch_portal_sidebar_agent_style wire_account_panel patch_assist_chat patch_assist_dedupe ensure_react_hooks densify_stars patch_portal_chat_ui patch_forgot_password ensure_resolve_chat fix_send_chat_message fix_claim_and_send patch_hold_nuclear; do
            if [ -f "scripts/${s}.py" ]; then run_py "scripts/${s}.py"; fi
          done

          run_py scripts/patch_livechat_master_v1.py
          run_py scripts/patch_hotfix_v2.py

          # schema-safe customers (never select missing avatar_url)
          run_py scripts/force_schema_safe_cols.py

          test $(wc -c < src/components/CustomerPortal.tsx) -gt 50000 && echo OK_PORTAL || { echo FAIL_PORTAL; exit 1; }
          test $(wc -c < src/context/PlatformContext.tsx) -gt 5000 && echo OK_PLATFORM || { echo FAIL_PLATFORM; exit 1; }
          grep -q "usePlatform" src/context/PlatformContext.tsx && echo OK_USE_PLATFORM || { echo FAIL_USE_PLATFORM; exit 1; }
          set -e

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify dist index
        run: |
          test -f dist/index.html
          grep -q 'assets/' dist/index.html && echo OK_DIST_ASSETS || { echo FAIL_DIST_STILL_DEV_ENTRY; cat dist/index.html; exit 1; }
          ! grep -q '/src/main.tsx' dist/index.html && echo OK_NO_DEV_ENTRY || { echo FAIL_DEV_ENTRY_IN_DIST; exit 1; }

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
