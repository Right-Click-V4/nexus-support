name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Restore + critical patches
        run: |
          set -e
          python3 scripts/patch_fix_profile_escape.py || true
          python3 scripts/patch_restore_customer_portal.py
          python3 scripts/patch_restore_platform_ctx.py
          python3 scripts/patch_fix_cp_jsx_topbar.py || true
          python3 scripts/patch_ticket_ops_timeout.py || true
          python3 scripts/patch_postlogin_force_exit.py || true
          python3 scripts/patch_profile_rework.py || true
          python3 scripts/patch_profile_fetch_resilient.py || true
          python3 scripts/patch_status_fab.py || true
          python3 scripts/patch_livechat_fix_v2.py || true
          python3 scripts/patch_livechat_ui_404.py || true
          python3 scripts/patch_livechat_dark_presence.py || true
          python3 scripts/patch_livechat_lcp_dedupe.py || true
          python3 scripts/patch_livechat_fix_v2.py || true
          python3 scripts/patch_livechat_ui_404.py || true
          python3 scripts/patch_livechat_dark_presence.py || true
          python3 scripts/patch_livechat_lcp_dedupe.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || true
          git commit -m "fix: livechat dedupe + presence" || true
          git push || true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 scripts/patch_fix_profile_escape.py || true
          python3 scripts/patch_restore_customer_portal.py
          python3 scripts/patch_restore_platform_ctx.py
          python3 scripts/patch_fix_cp_jsx_topbar.py || true
          python3 scripts/patch_ticket_ops_timeout.py || true
          python3 scripts/patch_postlogin_force_exit.py || true
          python3 scripts/patch_profile_rework.py || true
          python3 scripts/patch_profile_fetch_resilient.py || true
          python3 scripts/patch_status_fab.py || true
          python3 scripts/patch_livechat_fix_v2.py || true
          python3 scripts/patch_livechat_ui_404.py || true
          python3 scripts/patch_livechat_dark_presence.py || true
          python3 scripts/patch_livechat_lcp_dedupe.py || true
          npm run build
          touch dist/.nojekyll

      - name: Deploy dist to gh-pages
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf work-gh-pages && mkdir work-gh-pages && cd work-gh-pages
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch origin gh-pages --depth=1 && git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout -f origin/gh-pages && git checkout -B gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name preview ! -name '.git' -exec rm -rf {} +
          else
            git checkout --orphan gh-pages
          fi
          cp -a ../dist/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy ${GITHUB_SHA}" || echo "No changes"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
