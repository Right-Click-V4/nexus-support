name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Restore + patch portal
        run: |
          set -e
          GOOD=c3edde907e5e5be48439b7fea0df6dbe3dca6611
          CP_SZ=$(wc -c < src/components/CustomerPortal.tsx 2>/dev/null || echo 0)
          if [ "$CP_SZ" -lt 50000 ] || ! grep -q "PortalLiveChat" src/components/CustomerPortal.tsx 2>/dev/null; then
            echo "Restoring CustomerPortal from $GOOD"
            git show "$GOOD:src/components/CustomerPortal.tsx" > src/components/CustomerPortal.tsx
          fi
          if [ -f scripts/patch_send_optimistic.py ]; then python3 scripts/patch_send_optimistic.py || true; fi
          python3 scripts/patch_portal_logo.py || true
          grep -q "PortalLiveChat" src/components/CustomerPortal.tsx
          test -f src/SystemApp.tsx

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
