name: Fix livechat sync + presence + portal logo
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fix-livechat-sync.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply fixes
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re, urllib.request

          # --- onlineAgents ---
          p = Path('src/lib/onlineAgents.ts')
          t = p.read_text()
          t = t.replace('ONLINE_WINDOW_MS = 45_000', 'ONLINE_WINDOW_MS = 90_000')
          t = t.replace('ONLINE_WINDOW_MS = 45000', 'ONLINE_WINDOW_MS = 90_000')
          p.write_text(t)
          print('onlineAgents', '90_000' in t)

          # --- deskPresence ---
          p = Path('src/lib/deskPresence.ts')
          t = p.read_text()
          t = t.replace('const LIVE_MS = 45_000;', 'const LIVE_MS = 90_000;')
          t = t.replace('const TRACK_MIN_MS = 60_000;', 'const TRACK_MIN_MS = 25_000;')
          p.write_text(t)
          print('deskPresence', '90_000' in t, '25_000' in t)

          # --- TicketContext touchPresence ---
          p = Path('src/context/TicketContext.tsx')
          t = p.read_text()
          t = t.replace(
              'if (g.__nexusTouchAt && now - g.__nexusTouchAt < 60_000) return;',
              'if (g.__nexusTouchAt && now - g.__nexusTouchAt < 20_000) return;',
          )
          if 'setAgents((prev) => prev.map((a) => (a.id === currentAgent.id ? { ...a, last_seen_at }' not in t:
              t = t.replace(
                  '''await supabase.from('agents').update({ last_seen_at }).eq('id', currentAgent.id);
      setCurrentAgent((prev) => (prev ? { ...prev, last_seen_at } : prev));''',
                  '''await supabase.from('agents').update({ last_seen_at }).eq('id', currentAgent.id);
      setCurrentAgent((prev) => (prev ? { ...prev, last_seen_at } : prev));
      setAgents((prev) => prev.map((a) => (a.id === currentAgent.id ? { ...a, last_seen_at } : a)));''',
              )
          p.write_text(t)
          print('TicketContext touch')

          # --- SystemAppCore presence interval ---
          p = Path('src/SystemAppCore.tsx')
          t = p.read_text()
          idx = t.find('void touchPresence')
          if idx > 0:
              chunk = t[idx:idx+900]
              if '90_000' in chunk:
                  t = t[:idx] + chunk.replace('90_000', '30_000', 1) + t[idx+900:]
              elif '60_000' in chunk:
                  t = t[:idx] + chunk.replace('60_000', '30_000', 1) + t[idx+900:]
          p.write_text(t)
          print('SystemAppCore interval')

          # --- LiveChatPage always poll ---
          p = Path('src/components/LiveChatPage.tsx')
          t = p.read_text()
          old = '''  useEffect(() => {
    if (!selectedId) return;
    const id = window.setInterval(() => {
      void refreshPlatform();
    }, 4000);
    return () => window.clearInterval(id);
  }, [selectedId, refreshPlatform]);'''
          new = '''  useEffect(() => {
    // Always poll so new customer chats appear even with nothing selected
    void refreshPlatform();
    const id = window.setInterval(() => {
      void refreshPlatform();
    }, 2500);
    return () => window.clearInterval(id);
  }, [refreshPlatform]);'''
          if old in t:
              t = t.replace(old, new)
              print('LiveChatPage poll fixed')
          else:
              print('LiveChatPage poll pattern skip')
          p.write_text(t)

          # --- PlatformContext ---
          p = Path('src/context/PlatformContext.tsx')
          t = p.read_text()

          if 'Optimistic UI so customer' not in t and 'setConversations((prev) => {
      const exists = prev.some' not in t:
              old_send = '''  const sendChatMessage = async (conversationId: string, text: string, sender: 'agent' | 'customer') => {
    const msg: ChatMessage = { id: `m-${Date.now()}`, text, sender, created_at: new Date().toISOString() };
    if (supabase) {
      await supabase.from('chat_messages').insert({ conversation_id: conversationId, text, sender });
      await supabase.from('chat_conversations').update({ preview: msg.text.slice(0, 120), status: 'active', unread: sender === 'customer' ? 1 : 0, updated_at: new Date().toISOString() }).eq('id', conversationId);
      await refreshPlatform();
    } else {
      setConversations((prev) => prev.map((c) => c.id === conversationId ? { ...c, messages: [...(c.messages || []), msg], preview: msg.text, status: 'active' as const, unread: sender === 'customer' ? (c.unread || 0) + 1 : 0 } : c));
    }
  };'''
              new_send = '''  const sendChatMessage = async (conversationId: string, text: string, sender: 'agent' | 'customer') => {
    const msg: ChatMessage = { id: `m-${Date.now()}`, text, sender, created_at: new Date().toISOString() };
    setConversations((prev) => {
      const exists = prev.some((c) => c.id === conversationId);
      if (!exists) {
        return [{
          id: conversationId,
          customer_name: 'Customer',
          status: 'active' as const,
          preview: msg.text.slice(0, 120),
          unread: sender === 'customer' ? 1 : 0,
          messages: [msg],
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        }, ...prev];
      }
      return prev.map((c) =>
        c.id === conversationId
          ? { ...c, messages: [...(c.messages || []), msg], preview: msg.text.slice(0, 120), status: 'active' as const, unread: sender === 'customer' ? (c.unread || 0) + 1 : 0, updated_at: new Date().toISOString() }
          : c,
      );
    });
    if (supabase) {
      const { error: insErr } = await supabase.from('chat_messages').insert({ conversation_id: conversationId, text, sender });
      if (insErr) {
        console.error('sendChatMessage insert', insErr);
        await supabase.from('chat_messages').insert({ conversation_id: conversationId, body: text, text, sender } as Record<string, unknown>);
      }
      await supabase.from('chat_conversations').update({ preview: msg.text.slice(0, 120), status: 'active', unread: sender === 'customer' ? 1 : 0, updated_at: new Date().toISOString() }).eq('id', conversationId);
      try { await refreshPlatform(); } catch (e) { console.error('sendChatMessage refresh', e); }
    }
  };'''
              if old_send in t:
                  t = t.replace(old_send, new_send)
                  print('sendChatMessage optimistic')
              else:
                  print('sendChatMessage pattern missing')

          if "setConversations((p) => [conv, ...p.filter" not in t:
              old_c = '''      const { data, error } = await supabase.from('chat_conversations').insert(payload).select('*').single();
      if (error || !data) {
        const { data: d2, error: e2 } = await supabase.from('chat_conversations').insert({ customer_name, customer_email, status: 'waiting' }).select('*').single();
        if (e2 || !d2) throw e2 || new Error('create chat failed');
        await refreshPlatform();
        return d2 as ChatConversation;
      }
      await refreshPlatform();
      return data as ChatConversation;'''
              new_c = '''      const { data, error } = await supabase.from('chat_conversations').insert(payload).select('*').single();
      if (error || !data) {
        console.error('createChat', error);
        const { data: d2, error: e2 } = await supabase.from('chat_conversations').insert({ customer_name, customer_email, status: 'waiting' }).select('*').single();
        if (e2 || !d2) throw e2 || new Error('create chat failed');
        const conv = { ...(d2 as ChatConversation), messages: [], branch: meta?.branch, ticket_id: meta?.ticket_id };
        setConversations((p) => [conv, ...p.filter((c) => c.id !== conv.id)]);
        try { await refreshPlatform(); } catch {}
        return conv;
      }
      const conv = { ...(data as ChatConversation), messages: [], branch: meta?.branch || (data as ChatConversation).branch, ticket_id: meta?.ticket_id || (data as ChatConversation).ticket_id };
      setConversations((p) => [conv, ...p.filter((c) => c.id !== conv.id)]);
      try { await refreshPlatform(); } catch {}
      return conv;'''
              if old_c in t:
                  t = t.replace(old_c, new_c)
                  print('createChat optimistic')
              else:
                  print('createChat pattern missing')

          if 'nexus-livechat-rt' not in t:
              marker = '''  // Supabase Realtime + 2s poll so every browser context (incl. incognito) stays in sync
  useEffect(() => {
    if (!isSupabaseConfigured || !supabase) return;

    void refreshAnnouncementsLight();'''
              chat_rt = '''  // Live chat realtime
  useEffect(() => {
    if (!isSupabaseConfigured || !supabase) return;
    let channel: ReturnType<NonNullable<typeof supabase>['channel']> | null = null;
    try {
      channel = supabase
        .channel('nexus-livechat-rt')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_conversations' }, () => { void refreshPlatform(); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, () => { void refreshPlatform(); })
        .subscribe();
    } catch (err) {
      console.warn('livechat realtime unavailable', err);
    }
    return () => {
      try { if (channel && supabase) void supabase.removeChannel(channel); } catch {}
    };
  }, [refreshPlatform]);

''' + marker
              if marker in t:
                  t = t.replace(marker, chat_rt)
                  print('chat realtime added')
              else:
                  print('realtime marker missing')
          p.write_text(t)

          # --- CustomerPortal restore + logo ---
          p = Path('src/components/CustomerPortal.tsx')
          text = p.read_text() if p.exists() else ''
          if len(text) < 20000 or 'PortalLiveChat' not in text:
              for sha in ['1c510ba', '0c977a47df06c6e8beaf8deec011ea0b31b429ca', 'e973f0632f202e8dc0dabbbc65a8be25600c23f9']:
                  import subprocess
                  try:
                      content = subprocess.check_output(['git', 'show', f'{sha}:src/components/CustomerPortal.tsx'], text=True, stderr=subprocess.DEVNULL)
                      if 'PortalLiveChat' in content and len(content) > 20000:
                          text = content
                          print('restored CP from', sha)
                          break
                  except Exception as e:
                      print('sha fail', sha, e)
              else:
                  URL = 'https://raw.githubusercontent.com/Right-Click-V4/nexus-support/0c977a47df06c6e8beaf8deec011ea0b31b429ca/src/components/CustomerPortal.tsx'
                  text = urllib.request.urlopen(URL, timeout=45).read().decode()
                  print('restored CP from raw')

          if 'useBranding' not in text:
              text = text.replace(
                  "import { usePlatform } from '../context/PlatformContext';",
                  "import { usePlatform } from '../context/PlatformContext';\nimport { useBranding } from '../context/BrandingContext';",
              )

          new_brand = '''function BrandMark({ logoUrl, className = 'w-8 h-8' }: { logoUrl?: string; className?: string }) {
  if (logoUrl) {
    return (
      <div className={`${className} rounded-xl overflow-hidden bg-white/10 ring-1 ring-white/15 flex items-center justify-center shrink-0`}>
        <img src={logoUrl} alt="" className="w-full h-full object-contain" />
      </div>
    );
  }
  return (
    <div className={`${className} rounded-xl bg-gradient-to-br from-brand-500 to-violet-600 flex items-center justify-center shadow-md shadow-brand-900/40 shrink-0`}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
        <path d="M4 4 L20 20 M20 4 L4 20" stroke="white" strokeWidth="3.2" strokeLinecap="round" />
        <path d="M12 2 L13.6 9.6 L21 11.2 L13.6 12.8 L12 20.5 L10.4 12.8 L3 11.2 L10.4 9.6 Z" fill="white" />
        <circle cx="12" cy="11.2" r="1.4" fill="white" />
      </svg>
    </div>
  );
}'''
          if 'function BrandMark' in text:
              start = text.index('function BrandMark')
              i = text.index('{', start)
              depth = 0
              for j in range(i, len(text)):
                  if text[j] == '{': depth += 1
                  elif text[j] == '}':
                      depth -= 1
                      if depth == 0:
                          text = text[:start] + new_brand + text[j+1:]
                          break

          if 'const { branding } = useBranding()' not in text:
              for needle in [
                  "export default function CustomerPortal({ onBackToAgent }: Props) {\n  const { createTicket, updateTicket",
                  "export default function CustomerPortal({ onBackToAgent }: Props) {\n  const { createTicket",
              ]:
                  if needle in text:
                      text = text.replace(
                          needle,
                          "export default function CustomerPortal({ onBackToAgent }: Props) {\n  const { branding } = useBranding();\n  const logoUrl = (branding.logoUrl || '').trim();\n  const appName = (branding.appName || '').trim() || 'Nexus Ops';\n  const { createTicket" + (", updateTicket" if "updateTicket" in needle else ""),
                          1,
                      )
                      break

          text = text.replace('<BrandMark />', '<BrandMark logoUrl={logoUrl} />')
          text = text.replace('<BrandMark className="w-8 h-8" />', '<BrandMark logoUrl={logoUrl} className="w-8 h-8" />')
          text = text.replace('portal-sidebar-title">Nexus Ops</div>', 'portal-sidebar-title">{appName}</div>')
          Path('src/components/CustomerPortal.tsx').write_text(text)
          print('CustomerPortal', len(text), 'branding', 'useBranding' in text)
          print('ALL PATCHES DONE')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status
          git commit -m "fix(livechat): accurate online agents, chat sync, portal logo" || exit 0
          git push
